<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇小游戏-阶段1</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
        }
        #gameCanvas {
            border: 3px solid #42b983;
            background-color: black;
        }
        .info-panel{
            display:flex;
            gap:30px;
            font-size:18px;
            margin-bottom:8px;
        }
        button{
            padding:6px 14px;
            font-size:16px;
            cursor:pointer;
            background:#42b983;
            color:#000;
            border:none;
            border-radius:4px;
            margin: 8px 0;
        }
        a{
            color:#42b983;
            margin-top:10px;
        }
    </style>
</head>
<body>
    <h2>贪吃蛇 | 方向键 ↑↓←→ 手动控制</h2>
    <div class="info-panel">
        <div>当前得分：<span id="score">0</span></div>
        <div>最高分：<span id="highScore">0</span></div>
        <div>已吃食物：<span id="foodCount">0</span></div>
    </div>
    <button id="resetBtn">重置游戏</button>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="tip">点击画布，按方向键开始游戏</p>
    <br>
    <a href="index.html">← 返回自我介绍主页</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score');
        const highScoreText = document.getElementById('highScore');
        const foodCountText = document.getElementById('foodCount');
        const resetBtn = document.getElementById('resetBtn');
        const tipText = document.getElementById('tip');

        const size = 20;
        let snake;
        let food;
        let dx;
        let dy;
        let score;
        let foodCount;
        let gameOver;
        let gameLoopTimer;

        // 读取本地保存最高分
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreText.innerText = highScore;

        // 初始化游戏
        function initGame(){
            snake = [{x:10*size, y:10*size}];
            food = spawnFood();
            dx = size;
            dy = 0;
            score = 0;
            foodCount = 0;
            gameOver = false;
            updateUI();
            tipText.innerText = "点击画布，按方向键开始游戏";
            if(gameLoopTimer) clearInterval(gameLoopTimer);
            gameLoopTimer = setInterval(gameLoop,150);
        }

        // 生成食物，防止食物生成在蛇身上
        function spawnFood(){
            let newFood;
            while(true){
                newFood = {
                    x: Math.floor(Math.random() * canvas.width / size) * size,
                    y: Math.floor(Math.random() * canvas.height / size) * size
                }
                let onSnake = false;
                for(let seg of snake){
                    if(seg.x === newFood.x && seg.y === newFood.y){
                        onSnake = true;
                        break;
                    }
                }
                if(!onSnake) break;
            }
            return newFood;
        }

        function updateUI(){
            scoreText.innerText = score;
            foodCountText.innerText = foodCount;
            if(score > highScore){
                highScore = score;
                highScoreText.innerText = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
        }

        // 键盘监听
        document.addEventListener('keydown', (e)=>{
            if(gameOver) return;
            tipText.innerText = "";
            switch(e.key){
                case 'ArrowUp': if(dy !== size){ dx=0; dy=-size; } break;
                case 'ArrowDown': if(dy !== -size){ dx=0; dy=size; } break;
                case 'ArrowLeft': if(dx !== size){ dx=-size; dy=0; } break;
                case 'ArrowRight': if(dx !== -size){ dx=size; dy=0; } break;
            }
        })

        resetBtn.addEventListener('click', initGame);

        function gameLoop(){
            if(gameOver){
                ctx.fillStyle = "#ff4444";
                ctx.font = "30px sans-serif";
                ctx.fillText("游戏结束", 130, 200);
                clearInterval(gameLoopTimer);
                tipText.innerText = "游戏结束，点重置按钮重新开始";
                return;
            }
            // 清空画布
            ctx.fillStyle="#000";
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // 新蛇头
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙判断
            if(head.x <0 || head.x >= canvas.width || head.y<0 || head.y >= canvas.height){
                gameOver = true;
            }
            // 撞到自身
            for(let seg of snake){
                if(head.x === seg.x && head.y === seg.y){
                    gameOver = true;
                }
            }

            snake.unshift(head);
            // 判断吃到食物
            if(head.x === food.x && head.y === food.y){
                score +=10;
                foodCount +=1;
                updateUI();
                food = spawnFood();
            }else{
                snake.pop();
            }

            // 绘制蛇
            ctx.fillStyle="#42b983";
            for(let seg of snake){
                ctx.fillRect(seg.x, seg.y, size-1, size-1);
            }
            // 绘制食物
            ctx.fillStyle="#ff5555";
            ctx.fillRect(food.x, food.y, size-1, size-1);
        }
        initGame();
    </script>
</body>
</html>
